<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ThreeOfUs Space</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">ThreeOfUs<span>Space</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="about.html">Tentang Kami</a></li>
                <li><a href="contact.html" class="active">Kontak</a></li>
            </ul>
        </nav>
        <button id="theme-toggle">🌙 Mode Gelap</button>
    </header>

    <main>
        <section class="contact-section">
            <h1>Kirim Pesan Ke Tim Kami</h1>
            <p>Punya pertanyaan, masukan, atau tawaran kolaborasi? Silakan diisi formulir di bawah ini ya!</p>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Nama Lengkap:</label>
                    <input type="text" id="name" name="name" placeholder="Masukkan nama kamu">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="contoh@gmail.com">
                </div>

                <div class="form-group">
                    <label for="message">Pesan:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan kamu di sini..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
                <p id="form-feedback" class="feedback-msg"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ThreeOfUs Space | D4 Manajemen Informatika UNESA.</p>
    </footer>
</body>
</html>
